<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thursday PC Chrome</title><style>body{width:330px;margin:0;padding:18px;font:14px system-ui;background:#111923;color:#f1f5fb}h1{font-size:19px;margin:0 0 8px}p{color:#b9c5d3;line-height:1.45}label{display:block;margin:14px 0 6px}input{box-sizing:border-box;width:100%;padding:9px;color:white;background:#1c2938;border:1px solid #64748b;border-radius:6px}button{padding:9px 12px;margin:9px 7px 0 0;border:0;border-radius:6px;font:inherit;cursor:pointer;background:#a8d2ff;color:#09243f}button.secondary{background:#39485a;color:white}#status{min-height:2.8em}</style></head><body><h1>Thursday PC Chrome</h1><p>Share only the tab you choose. Keep Chrome and this tab open. Pause or stop any time.</p><label for="server">Your Thursday HTTPS address</label><input id="server" type="url" placeholder="https://your-thursday.example" autocomplete="off"><label for="key">Pairing key from Thursday Settings</label><input id="key" type="password" autocomplete="off" spellcheck="false"><button id="pair">Pair this Chrome</button><label><input id="sites" type="checkbox" style="width:auto"> Allow automation across websites in the shared tab</label><p id="status" role="status"></p><button id="share" class="secondary">Share this tab</button><button id="pause" class="secondary">Pause</button><button id="stop" class="secondary">Stop and forget key</button><script src="popup.js"></script></body></html>
